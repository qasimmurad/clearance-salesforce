name: Keep Streamlit app awake

# Streamlit Community Cloud hibernates an app after 12 hours without traffic,
# and a plain HTTP request does not reliably count as traffic. This opens the
# app in a real browser and clicks the "Yes, get this app back up!" button if
# the app has gone to sleep.
#
# GitHub turns off scheduled workflows in public repos after 60 days with no
# repository activity. If the app starts sleeping again, check that this
# workflow is still enabled in the Actions tab.

on:
  schedule:
    # Every 6 hours. GitHub can start scheduled runs up to an hour late, so
    # this stays well under the 12 hour hibernation threshold.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          playwright install --with-deps chromium

      - name: Wake the app if it is asleep
        run: python scripts/keep_awake.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-awake-screenshot
          path: /tmp/state.png
          if-no-files-found: warn
          retention-days: 14
